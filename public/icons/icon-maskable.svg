<?xml version="1.0" encoding="UTF-8"?>
<!--
  Maskable 아이콘 (Phase 0 플레이스홀더).
  안전 영역(safe zone) 확보를 위해 아이콘을 중앙 80% 범위에 배치한다.
  05_IMAGE_STYLE_GUIDE 준수: flat, 벡터, 제한된 팔레트. Phase 1 에서 정식 세트로 대체.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Workout Coach">
  <rect width="512" height="512" fill="#15803D"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round">
    <line x1="150" y1="206" x2="150" y2="306"/>
    <line x1="202" y1="176" x2="202" y2="336"/>
    <line x1="202" y1="256" x2="310" y2="256"/>
    <line x1="310" y1="176" x2="310" y2="336"/>
    <line x1="362" y1="206" x2="362" y2="306"/>
  </g>
</svg>
